
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f5-log-redactor
  labels:
    app: f5-log-redactor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: f5-log-redactor
  template:
    metadata:
      labels:
        app: f5-log-redactor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redactor
          image: f5-log-redactor:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: rules
              mountPath: /app/rules.yaml
              subPath: rules.yaml
              readOnly: true

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10

      volumes:
        - name: rules
          configMap:
            name: f5-redaction-rules
            optional: false
